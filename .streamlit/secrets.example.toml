[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_VALUE"
client_id = "GOOGLE_OAUTH_CLIENT_ID"
client_secret = "GOOGLE_OAUTH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[app]
google_sheet_id = "GOOGLE_SPREADSHEET_ID"
authorized_emails = [
  "authorized-person-1@example.com",
  "authorized-person-2@example.com",
  "authorized-person-3@example.com",
]

[gcp_service_account]
type = "service_account"
project_id = "GOOGLE_CLOUD_PROJECT_ID"
private_key_id = "PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nREPLACE_WITH_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
client_email = "SERVICE_ACCOUNT_EMAIL"
client_id = "SERVICE_ACCOUNT_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "SERVICE_ACCOUNT_CERTIFICATE_URL"